info:
  title: Mini Assistant API
  version: 1.0.0
  description: |
    ### Visão Geral
    Bem-vindo à documentação da API do **Mini Assistant**. Esta plataforma SaaS (Software as a Service) permite que empresas automatizem o atendimento ao cliente via WhatsApp usando um sistema avançado de orquestração de agentes de IA (Google Gemini).

    A arquitetura é multi-tenant, o que significa que cada cliente (tenant) pode configurar seus próprios agentes de IA e conectar seu próprio número de WhatsApp Business, garantindo total isolamento e personalização.

    ### Como Começar: Um Guia Rápido

    Para integrar e usar a API, siga estes passos:

    **Passo 1: Registrar um Novo Usuário e Cliente (Tenant)**
    - Use o endpoint `POST /auth/register`.
    - Forneça os dados do usuário (`name`, `email`, `password`) e o nome da empresa (`companyName`).
    - Isso criará um `Client` (tenant) e um `User` (administrador) associado a ele.

    **Passo 2: Autenticar e Obter Token**
    - Use o endpoint `POST /auth/login` com o email e a senha registrados.
    - A API retornará um cookie `HttpOnly` contendo o token JWT, que será usado automaticamente nas requisições subsequentes feitas pelo navegador. Para testes em ferramentas como o Postman, você precisará gerenciar os cookies ou usar o token como um `Bearer Token`.

    **Passo 3: Configurar os Agentes de IA**
    - Para cada tipo de interação (`contact`, `history`, `pricing`, etc.), você precisa configurar o comportamento do agente.
    - Use o endpoint `POST /client/{clientId}/config/{agentType}`.
    - Substitua `{clientId}` pelo ID do seu cliente (obtido no registro/login) e `{agentType}` pelo tipo de agente.
    - O corpo da requisição deve conter os dados específicos para cada agente (consulte os schemas `ContactConfig`, `HistoryConfig`, etc.).

    **Passo 4: Conectar o WhatsApp (Onboarding)**
    - O frontend da sua aplicação de gerenciamento precisa implementar o fluxo "Embedded Signup" da Meta.
    - **a)** Obtenha o `configId` e o `appId` da Meta usando o endpoint `GET /auth/meta-config`.
    - **b)** No frontend, use esses dados para renderizar o botão "Conectar com WhatsApp".
    - **c)** Após o usuário autorizar a conexão na pop-up da Meta, você receberá um `code`.
    - **d)** Envie este `code` junto com o `clientId` para o endpoint `POST /auth/whatsapp/callback`. A API cuidará de obter e salvar o token de acesso de longa duração e os IDs necessários.

    **Passo 5: Testar o Assistente**
    - Com tudo configurado, você pode enviar perguntas para o seu assistente.
    - Use o endpoint `POST /task`.
    - Envie a `question` no corpo da requisição.
    - **Importante**: Inclua o `clientId` no cabeçalho da requisição como `x-client-id`.

    ### Fluxo de Autenticação
    A API usa autenticação baseada em token JWT. Após o login, o token é enviado em um cookie `HttpOnly` para segurança. Para endpoints protegidos, o token é verificado para autenticar o usuário e identificar o cliente (`tenant`).
