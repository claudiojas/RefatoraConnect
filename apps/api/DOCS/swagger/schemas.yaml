components:
  schemas:
    # Schemas de Autenticação
    LoginPayload:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "usuario@empresa.com"
        password:
          type: string
          example: "senha123"

    RegisterPayload:
      type: object
      required:
        - name
        - email
        - password
        - companyName
      properties:
        name:
          type: string
          example: "Nome do Usuário"
        email:
          type: string
          format: email
          example: "usuario@empresa.com"
        password:
          type: string
          example: "senha123"
        companyName:
          type: string
          example: "Nome da Empresa"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'

    # Schema do Usuário
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        clientId:
          type: string
          format: uuid

    # Schemas de Cliente (Tenant)
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        companyName:
          type: string
        onboardingCompleted:
          type: boolean
        whatsappAccessToken:
          type: string
          nullable: true
        whatsappPhoneNumberId:
          type: string
          nullable: true
        whatsappBusinessId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateClientPayload:
      type: object
      required:
        - name
        - companyName
        - email
      properties:
        name:
          type: string
          example: "Nome do Cliente"
        companyName:
          type: string
          example: "Empresa Cliente"
        email:
          type: string
          format: email
          example: "contato@empresa.com"

    # Schemas de Configuração de Agentes
    ContactConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        contactSuggestion:
          type: string
          example: "Para falar conosco, acesse a página de contato em nosso site."
        agentDescription:
          type: string
          example: "Direcionar o usuário para os canais de contato."

    HistoryConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        companyHistory:
          type: string
          example: "Nossa empresa foi fundada em 2010 com o objetivo de..."
        agentDescription:
          type: string
          example: "Responder perguntas sobre a história da empresa."

    MemoryConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        memoryGuidelines:
          type: string
          example: "Lembre-se das 3 últimas interações do usuário."
        agentDescription:
          type: string
          example: "Manter o contexto de conversas anteriores."

    PricingConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        paymentMethods:
          type: string
          example: "Aceitamos cartão de crédito, boleto e PIX."
        agentDescription:
          type: string
          example: "Informar sobre métodos de pagamento."
        noPricingInfoText:
          type: string
          example: "Para obter um orçamento, por favor, entre em contato com nossa equipe de vendas."

    ServicesConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        servicesOffered:
          type: string
          example: "Oferecemos desenvolvimento web, mobile e consultoria em nuvem."
        agentDescription:
          type: string
          example: "Descrever os serviços que a empresa oferece."
        conversationStyle:
          type: string
          nullable: true
          example: "Seja sempre formal e use 'senhor(a)'."

    SmalltalkConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        smalltalkGuidelines:
          type: string
          example: "Seja amigável e use emojis."
        agentDescription:
          type: string
          example: "Conduzir conversas informais e saudações."

    # Schemas de Erro
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Mensagem de erro detalhada."

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
